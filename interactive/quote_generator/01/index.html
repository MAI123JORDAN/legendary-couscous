<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote of the Day</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Quote of the Day</h1>
        <div id="quote" class="quote">"Your quote will appear here."</div>
        <div id="author" class="author">- Author</div>
        <hr>
        <div class="social-icons">
            <img src="icons8-sound-100-3.png" alt="Sound" class="social-icon">
            <img src="icons8-copy-100-5.png" alt="Copy" class="social-icon">
            <img src="icons8-twitter-bird-100.png" alt="Twitter" class="social-icon">
        </div>
        <button id="newQuoteBtn">New Quote</button>
    </div>
    <script src="script.js"></script>
</body>
</html>

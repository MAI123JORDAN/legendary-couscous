<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">    
            <h2>Sign In</h2>
            
            <input type="email" placeholder="Email address" required>
            <input type="password" placeholder="Password" required>
            <label for="checkbox">
                <input type="checkbox"> Remember me
            </label>

            <button type="submit" class="btn">Sign In</button>
            <p><a href="#">Forgot password?</a></p>
        </div>

        <div class="right">
            <h2>Glad to see you!</h2>

            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna.</p>

            <div class="social-icons">
                <a href="#"><img src="images/icons8-facebook-logo-50.png" alt="Facebook"></a>
                <a href="#"><img src="images/icons8-google-logo-100-10.png" alt="Google"></a>
                <a href="#"><img src="images/icons8-instagram-logo-50.png" alt="Instagram"></a>
                <a href="#"><img src="images/icons8-twitter-bird-50-3.png" alt="Twitter"></a>
            </div>
            
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </div>
</body>
</html>

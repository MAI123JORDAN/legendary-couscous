<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Login | Secure Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-container">
            
            <div class="brand-side">
                <div class="brand-content">
                    <h1>Nexus<span>.</span></h1>
                    <p>Experience the next generation of creative development and 3D precision.</p>
                </div>
            </div>

            <div class="form-side">
                <form id="login-form">
                    <h2>Welcome Back</h2>
                    <p class="subtitle">Please enter your details to sign in.</p>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-field">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" placeholder="mai@example.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-field">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Sign In</button>

                    <p class="signup-text">Don't have an account? <a href="#">Create one for free</a></p>
                </form>
            </div>

        </div>
    </div>

</body>
</html>
